# The full method on the real rig with every robot-facing step IK-screened:
# MDM/UQ corrections typed by the operator mid-run (use --interactive, see
# README), unreachable MDM frames dropped at push time, each playback step
# held unless the robot can reach it exactly by continuation, and the
# post-playback goal phase gated like arm_mpc_cartesian_no_mdm_ik_gated_real.
# Env and planner constants match arm_mpc_cartesian_no_mdm_ik_gated_real.yaml.
env: real
env_params:
  robot: kinova_gen3
  robot_max_joint_delta: 0.2
  # Keep IK solutions inside the real controller's soft joint limits
  # (joint_limit_padding_deg: 15.0 = 0.262 rad in config_tuned.yaml) with a
  # small margin — commands in the padding band are rejected by its checks.
  robot_joint_limit_padding: 0.27
  # emprise-gen3-controller ZMQ server (launch_server.py) on this host. Set to
  # null to close the loop on the live person without commanding the arm — do
  # that dry run first.
  real_mirror_host: "127.0.0.1"
  # real_mirror_host: "192.168.2.68"
  # Prompt the operator once before the arm starts tracking. Nothing is moved at
  # startup — the grasp must already be taken. Set false only for headless/mock
  # runs.
  real_mirror_confirm_start: true
  # Track targets with joint-space impedance instead of stiff position control —
  # the arm yields to the person. Gains live server-side in config_tuned.yaml.
  # Set to position_joint (the default) for stiff tracking.
  control_mode: compliant_joint
  # OptiTrack PC running Motive. Its streaming Local Interface must be this
  # LAN address, not loopback, or no packets leave that machine.
  mocap_host: "192.168.2.243"
  # Motive rigid-body streaming ids. robot_base fixes where the robot stands;
  # collar_right closes the last DOF — the measured left->right collar axis is
  # the torso's facing, so the person's orientation relative to the robot is
  # measured rather than assumed. It is read at calibration only.
  mocap_rigid_bodies:
    robot_base: 1
    collar: 2
    collar_right: 6
    shoulder: 3
    elbow: 4
    wrist: 5
  # Hold the last valid pose through tracking dropouts up to this long (s),
  # then raise and halt.
  mocap_hold_timeout: 0.5
  # Live pybullet window: the measured person as an SMPL mesh next to the robot,
  # both in the registered frame. Needs a display — set false when running
  # headless (over ssh without X).
  live_view: true
  # Human-mesh refresh rate. Each refresh replaces the whole mesh (~140 ms in the
  # GUI) and blocks the MPC step, so keep it low; the robot still animates every
  # step.
  live_view_fps: 5
  # Draw each planned step in the live view as it is solved — measured person,
  # measured robot base, measured grasp — and wait for approval before the first
  # command reaches the arm. Needs live_view. Only the pre-correction plan to
  # the Cartesian goal exists this early — the MDM correction has not been
  # spoken yet; the rollout runs the gated planner, gate included.
  preview_plan: true
planner: arm_mpc_cartesian_ik_gated
# Human-action sampling as in arm_mpc_cartesian_no_mdm_ik_gated_real.yaml:
# rollouts whose first grasp_residual_frames frames imply a gripper pose the
# robot cannot IK to exactly (pose error above max_grasp_ik_residual, metres +
# radians) are discarded outright. This uses the real env's analytical Gen3
# IK and padded controller joint box, seeded through each rollout. The floor is
# IK convergence, not model mismatch, so the threshold sits near zero. The same
# threshold screens MDM playback: unreachable frames are dropped at push time
# and a step continuation cannot place is held rather than commanded.
max_grasp_ik_residual: 0.001
grasp_residual_frames: 3
# Consecutive playback steps without closest-approach progress on the current
# frame before the cursor skips it. Worst case an all-unreachable correction
# costs mdm_frames * playback_stall_steps steps out of the session budget.
playback_stall_steps: 40
# Planner knobs match arm_mpc_cartesian_no_mdm_ik_gated_real.yaml, except
# steps: every correction is played back at the rate caps below, so a session
# holds far more steps than one reach — this budgets the whole session.
steps: 3000
horizon: 10
n_mpc_samples: 1000
max_angle_delta: 0.01
goal_threshold: 0.15
advance_threshold: 0.15
# Correction playback is rate-limited against the *measured* arm and advances a
# frame only once the arm reaches it, so this bounds how far the command may lead
# the person; the env's own robot_max_joint_delta is the hard per-step bound.
# Under compliant_joint the measured arm settles short of commands — if
# steady-state deflection under load exceeds this, frames finish by stall-skip
# rather than by being reached; loosen it on the rig if the skip logs say so.
max_playback_delta: 0.002
trajectory_fraction: 1
mdm_frames: 50
# Ignored with --interactive; kept so this config also runs scripted.
text_time: 300
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose_v3.pt"

corrections:
  trigger_threshold: 0.02

uq:
  diffusion_samples: 500
  n_clusters: 3
  # No auto_cluster: each correction opens the cluster picker so the person's
  # intent — and its magnitude — is chosen rather than assumed.
  scale: 1.0

# Demo-runner "base1" initial pose ([shoulder, elbow, wrist] axis-angles).
# The run starts from the *measured* arm configuration — every row is
# overwritten by mocap (the registration yaw comes from the collar-to-collar
# axis, not from any slot here).
arm:
  - [-0.2578684731175734, 0.11215073986226905, -0.44187915175365783]
  - [0.6868865380518193, -0.18, -0.11006289820501858]
  - [0.035651850950680734, -1.23, 0.7515284911778386]

cartesian:
  # Demo-runner "hits limit 1" goal.
  goals:
    - [-0.25, 0.1, 0.25]
  threshold: 0.05

preference_learning: false
preference_alpha: 0

llm_cost:
  enabled: true
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
