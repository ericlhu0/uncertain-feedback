planner: arm_mpc_cartesian
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.01
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose.pt"
goal_threshold: 0.15
advance_threshold: 0.15
max_playback_delta: 0.05  # max per-joint rotation (rad) per step while following the MDM trajectory
trajectory_fraction: 1
mdm_frames: 50
text_time: 10

corrections:
  trigger_threshold: 0.02


uq:
  diffusion_samples: 500
  n_clusters: 3
  auto_cluster: 0
  scale: 1.0  # default motion-magnitude scale for the chosen cluster (GUI slider overrides)

cartesian:
  goals:
    - [-0.15, 0.05, -0.1]
  threshold: 0.05

preference_learning: false
preference_alpha: 0

llm_cost:
  enabled: true
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
  backend: turns  # multi-turn: scores each candidate (rollout-vs-MDM L2) and keeps the best
  max_turns: 3    # turns x full MPC rollouts can be slow; keep small for testing

