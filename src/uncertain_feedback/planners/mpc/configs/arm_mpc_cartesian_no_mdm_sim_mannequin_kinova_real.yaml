env: sim_mannequin
env_params:
  robot: kinova_gen3
  robot_max_joint_delta: 0.01
  robot_base_offset: [0.6, -0.35, -0.35]
  # Keep the sim robot inside the real controller's soft joint limits
  # (joint_limit_padding_deg: 15.0 = 0.262 rad in config_tuned.yaml), with a
  # small margin for physics overshoot — commands in the padding band would
  # be rejected by the controller's safety checks.
  robot_joint_limit_padding: 0.27
  # Mirror the sim robot's joint trajectory onto the real Kinova Gen3 via an
  # emprise-gen3-controller ZMQ server (launch_server.py) running on this
  # host. The sim stays the source of truth; the real arm shadows it in
  # joint position mode.
  real_mirror_host: "127.0.0.1"
  # Prompt the operator before the initial (large) move to the sim start
  # configuration. Set false only for headless/mock runs.
  real_mirror_confirm_start: true
# Planner knobs match arm_mpc_cartesian_no_mdm_sim_mannequin_kinova.yaml.
steps: 1000
horizon: 10
n_mpc_samples: 1000
max_angle_delta: 0.001
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose_v3.pt"

# Demo-runner "base1" initial pose ([shoulder, elbow, wrist] axis-angles).
arm:
  - [-0.2578684731175734, 0.11215073986226905, -0.44187915175365783]
  - [0.6868865380518193, -0.18, -0.11006289820501858]
  - [0.035651850950680734, -1.23, 0.7515284911778386]

cartesian:
  # Demo-runner "hits limit 1" goal.
  goals:
    - [0.25, 0.3, 0.18]
  threshold: 0.05
