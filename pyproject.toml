[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertain_feedback"
version = "0.1.0"
description = "An example of how to structure research code."
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
   "matplotlib>=3.5,<3.6",
   "pyqt5",
   "numpy<1.24",
   "pandas",
   "pandas-stubs",
   "hydra-core",
   "omegaconf",
   # MDM dependencies
   "torch>=2.7.0",
   "torchvision>=0.22.0",
   "torchaudio>=2.7.0",
   "scipy",
   "scikit-learn",
   "h5py",
   "spacy>=3.4,<3.5",
   "en-core-web-sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.4.0/en_core_web_sm-3.4.0.tar.gz",
   "trimesh",
   "smplx",
   "chumpy",
   "ftfy",
   "regex",
   "lxml",
   "moviepy<2",
   "tqdm",
   "pybullet",
   "wandb",
   "transformers",
   "openai-clip",
   "pydantic>=1.9,<2",
   "pyquaternion",
   "gdown",
   "setuptools<70",
   "blobfile",
   # SAM 3D Body inference worker dependencies
   "timm>=1.0",
   "einops",
   "roma",
   "opencv-python",
   "yacs",
   "fvcore",
   "iopath",
   "pycocotools",
   "pytorch-lightning",
   "pyrender",
   "braceexpand",
   "detectron2",
   "flask",
   "openai>=1.0.0",
   "emprise-gen3-controller",
   "ssik",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter>=1.7.5",  # <1.7.5 crashes on links in docstrings
    "isort",
    "mypy",
    "types-PyYAML",
    "pylint>=2.14.5",
    "pytest>=7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uncertain_feedback = [
    "py.typed",
    "envs/assets/panda/*.urdf",
    "envs/assets/panda/meshes/*/*",
]

[tool.black]
line-length = 88
target-version = ["py310"]
# Vendored submodules are upstream code — never reformat them.
force-exclude = '''
/(
    motion-diffusion-model
  | sam-3d-body
  | MHR
)/
'''

[tool.docformatter]
# Match black's line length so docstrings are not re-wrapped narrower.
wrap-summaries = 88
wrap-descriptions = 88

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = [
    "venv/*",
    "build/",
    "*/motion-diffusion-model/*",
    "*/sam-3d-body/*",
    "*/MHR/*",
]
split_on_trailing_comma = true

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = [
    "venv/*",
    "build/",
    "demo_runner_artifacts/",
    "demo_designer_artifacts/",
    "llm_cost_artifacts/",
    "transfer_artifacts/",
    "src/uncertain_feedback/motion_generators/mdm/mdm_parser_util.py",
    "src/uncertain_feedback/motion_generators/mdm/sample_leftarm.py",
]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "mpl_toolkits.*",
    "scipy.*",
    "data_loaders.*",
    "sample.*",
    "utils.*",
    "torch",
    "torch.*",
    "sklearn.*",
    "yaml",
    "kimodo.*",
    "train.*",
    "smplx",
    "tqdm.*",
    "pybullet",
]
ignore_missing_imports = true

[tool.uv]
extra-build-dependencies = { chumpy = ["pip"], detectron2 = ["torch", "pip"] }
# emprise-gen3-controller is used only as a ZMQ client here; pin (pinocchio)
# and ruckig are server-side deps (and pin forces numpy>=2.0, conflicting with
# the MDM numpy<1.24 pin), so exclude them from resolution.
# ssik asks for numpy>=1.26 but its compiled extensions are built against the
# numpy 2 headers, whose ABI runs back to 1.19 — the Gen3 solver is exact on
# the MDM pin, so keep numpy where MDM needs it.
override-dependencies = [
    "pin; sys_platform == 'never'",
    "ruckig; sys_platform == 'never'",
    "numpy<1.24",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git" }
emprise-gen3-controller = { path = "/home/eric/emprise-gen3-controller", editable = true }
# No released ssik supports Python 3.10 (every wheel is cp311+); the 3.10 floor
# landed on main after 3.3.0, so track the tested commit rather than a tag.
ssik = { git = "https://github.com/personalrobotics/ssik", rev = "5109a670e041b842439cb74f501bacbb01f95883" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.0",
    "pylint>=2.14.5",
    "types-PyYAML",
]
