planner: arm_mpc_cartesian
motion_generator: kimodo
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.01
pose: "src/uncertain_feedback/motion_generators/kimodo/start_pose_kimodo.npy"
goal_threshold: 0.15
advance_threshold: 0.15
max_playback_delta: 0.05  # max per-joint rotation (rad) per step while following the MDM trajectory
trajectory_fraction: 1
mdm_frames: 50
text_time: 10

corrections:
  trigger_threshold: 0.02
num_denoising_steps: 100  # kimodo DDIM steps; lower (e.g. 30-50) is faster, lower quality


uq:
  # The worker now encodes the (shared) prompt once regardless of this count, so
  # raising it back toward 500 is feasible; cost scales with diffusion + memory.
  diffusion_samples: 60
  n_clusters: 3
  auto_cluster: 0
  scale: 1.0  # default motion-magnitude scale for the chosen cluster (GUI slider overrides)

cartesian:
  goals:
    - [-0.15, 0.05, -0.1]
  threshold: 0.05

preference_learning: false
preference_alpha: 0

llm_cost:
  enabled: true
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
  # backend defaults to "llm". The two settings below are inert for the "llm"
  # backend; they let run_backend_experiment.py flip to "turns"/"agent" without a
  # backend-specific config.
  max_turns: 3    # used by the "turns" backend
  codex_cmd: "codex exec --skip-git-repo-check -s danger-full-access"  # "agent" backend; outer bwrap isolation is applied automatically
