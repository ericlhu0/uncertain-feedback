steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.01
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose_v3.pt"
feedback:
  max_playback_delta: 0.05
  trajectory_fraction: 1
  frames: 50
  uq:
    diffusion_samples: 500
    n_clusters: 6
    scale: 0.25
    user_cluster: true

user: stroke_flexor_synergy

corrections:
  trigger_threshold: 0.02

cartesian:
  goals:
    - [0.42, 0.48, 0.12]
  threshold: 0.05

transfer:
  goals: []

persona_goals:
  stroke_flexor_synergy:
    cartesian:
      - [0.42, 0.48, 0.12]
      - [0.18, 0.52, 0.14]
      - [0.13, 0.50, 0.28]
      - [-0.04, 0.48, 0.18]
    transfer: []
  cross_body_pain:
    cartesian:
      - [-0.04, 0.45, 0.15]
      - [-0.12, 0.25, 0.25]
      - [0.42, 0.48, 0.12]
    transfer: []
  triceps_long_head_contracture:
    cartesian:
      - [0.25, 0.32, 0.15]
      - [-0.05, 0.40, 0.15]
      - [0.10, 0.10, 0.25]
    transfer: []

preference_learning: false
preference_alpha: 0

llm_cost:
  enabled: true
  backend: agent
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
  max_turns: 3
  codex_cmd: "codex exec --skip-git-repo-check -s danger-full-access"
