planner: arm_mpc_cartesian
seed: 0
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.01
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose_v3.pt"
goal_threshold: 0.15
advance_threshold: 0.15
max_playback_delta: 0.1
trajectory_fraction: 1
mdm_frames: 50

# Simulated-user persona (hidden comfort cost + feedback line); --persona overrides.
user: adhesive_capsulitis

corrections:
  trigger_threshold: 0.02

uq:
  diffusion_samples: 500
  n_clusters: 6
  scale: 0.5
  user_cluster: true

cartesian:
  goals:
    - [0.42, 0.30, 0.12]  # default (non-transfer runs / personas without an override)
  threshold: 0.05

# Held-out goals for the simulated-user transfer experiment. Pick wrist targets
# (spine3-relative) inside the arm's workspace; the generated cost should keep
# protecting the hidden preference on these even though the correction was
# given while reaching cartesian.goals[0].
transfer:
  goals:
    - [0.50, 0.20, 0.10]   # low-hand far lateral
    - [0.11, 0.44, 0.26]   # raised, in front
    - [-0.04, 0.42, 0.18]  # raised, across the body

# Per-persona goal overrides. The transfer experiment runs one persona at a time
# (--persona / user:), and each restriction needs its own goal geometry so the
# default plan visibly requires a correction. Goals are chosen inside the
# constraint-compliant reach envelope: the constraint-respecting solution
# actually reaches the goal (oracle wrist within cartesian.threshold), while the
# default plan reaches the same target by violating the restriction (frozen
# shoulder: base raises the upper arm high; flexor synergy: base straightens the
# elbow). The compliant solution reaches the same star with the arm held lower /
# the elbow more bent. All screened base-vs-oracle at rollout level
# (see transfer_artifacts/goal_screen_endframes_perpersona/).
persona_goals:
  adhesive_capsulitis:
    # Mix of low-hand lateral goals (base abducts the upper arm past the
    # elevation cap to reach out to the side, hand at shoulder/chin height, never
    # overhead) and raised goals (front / across-body) for direction spread. A
    # goal straight in front at chest height would NOT violate — the base reaches
    # it with the upper arm low — so the low-hand goals must be lateral.
    cartesian:
      - [0.42, 0.30, 0.12]   # low-hand lateral raise (correction given here)
    transfer:
      - [0.50, 0.20, 0.10]   # low-hand far lateral (hand at chest height)
      - [0.11, 0.44, 0.26]   # raised, in front
      - [-0.04, 0.42, 0.18]  # raised, across the body
  stroke_flexor_synergy:
    cartesian:
      - [0.42, 0.48, 0.12]   # lateral raise / "lift my arm" (correction given here)
    transfer:
      - [0.18, 0.52, 0.14]   # overhead-ish
      - [0.13, 0.50, 0.28]   # in front
      - [-0.04, 0.48, 0.18]  # across the body
  painful_arc:
    # Contrast requires the wrist target to force the upper arm into the painful
    # 60-120 deg elevation band: the base holds it there, while the compliant
    # oracle keeps elevation <60 deg and reaches by extending the forearm instead.
    # This confines goals to the moderate-height lateral->front arc — across-body
    # targets don't contrast (the oracle can't reach across the body while staying
    # below the band), low targets need no elevation at all, and overhead forces
    # every solution through the band. Within that arc the goals below span
    # far-lateral (low hand), diagonal, forward-raised, and straight-in-front. All
    # base-vs-oracle screened 3/3 (base viol >= 0.10 rad, oracle reaches +
    # compliant); see transfer_artifacts/goal_screen_videos_perpersona/.
    cartesian:
      - [0.42, 0.30, 0.12]   # low-hand lateral raise (correction given here)
    transfer:
      - [0.52, 0.12, 0.08]   # far lateral, low hand, close to body
      - [0.30, 0.28, 0.28]   # diagonal, mid
      - [0.20, 0.38, 0.24]   # forward, raised high
      - [0.10, 0.32, 0.35]   # straight in front, deep
  cross_body_pain:
    # The pose-dependent bound (tolerable elevation drops linearly with
    # adduction depth) blocks the DIRECT route to across-body targets, so the
    # compliant solution is a different path, not a lower endpoint: the base
    # drags the raised arm straight across the chest up the sliding limit,
    # while the oracle swings it up in front and reaches across from above,
    # wrist paths diverging by up to ~0.45 m. The compliant reach frontier is
    # tight — the deeper the cross, the lower the goal must be (x=-0.12 only
    # reachable at y<=0.25; y=0.40 only at x>=-0.05); deeper/higher targets
    # have no compliant reach (oracle stalls 0.07-0.15 m short). Screened
    # base-vs-oracle 2026-07-10 with the coupled bound: base max violation
    # 0.28-1.12 rad, oracle 0, both reach; oracle resuming AT the feedback
    # trigger still recovers and reaches (post-feedback max violation 0.12).
    cartesian:
      - [-0.05, 0.40, 0.35]  # opposite-shoulder height, front (correction given here)
    transfer:
      - [-0.12, 0.25, 0.25]  # chest-height cross (deepest compliant cross)
      - [-0.08, 0.32, 0.28]  # shoulder-height, shallow cross
      - [-0.08, 0.32, 0.35]  # shoulder-height, deep in front
  triceps_long_head_contracture:
    cartesian:
      - [0.25, 0.32, 0.15]   # moderate elevation and elbow bend
    transfer: []
  elbow_contracture:
    # ALL goals are across-body by geometric necessity: only reaching across the
    # torso forces the base to drive the elbow straight through the 29 deg comfort
    # floor (down to ~0-19 deg) to close the last of the distance, while the oracle
    # rides the floor at ~29 deg and reaches the same star with the elbow kept
    # folded. Front / lateral / low targets are reachable elbow-bent, so the base
    # never straightens and there is nothing to correct (verified: ~16 non-across
    # candidates, every one gives exactly zero base violation). Diversity is thus
    # confined to the across-body region — the goals below span mid / high / highest
    # elevation plus a deep-forward reach, each just inside the folded-arm envelope
    # (any farther and the folded oracle can no longer reach). Screened base
    # straightens 3/3, oracle reaches folded 3/3.
    cartesian:
      - [-0.18, 0.40, 0.34]  # across-body, high (correction given here)
    transfer:
      - [-0.22, 0.30, 0.34]  # across-body, mid height, wider
      - [-0.16, 0.44, 0.30]  # across-body, highest
      - [-0.16, 0.30, 0.40]  # across-body, deep / forward

preference_learning: false
preference_alpha: 0

llm_cost:
  enabled: true
  backend: llm
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
  max_turns: 3
  codex_cmd: "codex exec --skip-git-repo-check -s danger-full-access"
