steps: 350
horizon: 10
n_mpc_samples: 512
max_angle_delta: 0.0025
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose.pt"
feedback:
  max_playback_delta: 0.05  # max per-joint rotation (rad) per step while following the MDM trajectory
  trajectory_fraction: 1
  frames: 50
  uq:
    diffusion_samples: 200
    n_clusters: 5
    auto_cluster: null
    scale: 1.0  # default motion-magnitude scale for the chosen cluster (GUI slider overrides)

corrections:
  trigger_threshold: 0.02

cartesian:
  goals:
    - [-0.15, 0.05, -0.1]
  threshold: 0.05

# Optional:
preference_alpha: 0
# preference_window: 10

costs:
  elbow_height:
    min: -0.25
    max: 0.45
    weight: 100.0
    progress_weight: 100.0
