# Assisted bed-to-chair transfer preparation: gather the left forearm over the torso.
# A central wrist region permits different elbow bends without requiring midline crossing.
# Supine SMPL frame: +x left, +y above the bed, +z toward the feet.
pose: src/uncertain_feedback/motion_generators/mdm/transfer_bed_pose.pt
seed: 0
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.0025

cartesian:
  goals:
    - forearm_box:
        low: [-0.20, 0.06, -0.16]
        high: [0.30, 0.18, 0.32]
        wrist:
          low: [-0.18, 0.08, -0.14]
          high: [0.10, 0.18, 0.25]
  threshold: 0.001
