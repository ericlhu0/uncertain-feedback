planner: arm_mpc_cartesian
steps: 350
horizon: 10
n_mpc_samples: 512
max_angle_delta: 0.0025
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose.pt"
goal_threshold: 0.1
advance_threshold: 0.1
trajectory_fraction: 0.9
text_time: 10

uq:
  diffusion_samples: 500
  n_clusters: 5
  auto_cluster: null

cartesian:
  goals:
    - [-0.15, 0.05, -0.1]
  threshold: 0.05

# Optional:
preference_learning: false
preference_alpha: 0

costs:
  elbow_height:
    min: -0.25
    max: 0.45
    weight: 100.0
    progress_weight: 100.0
