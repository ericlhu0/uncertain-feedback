# Wheelchair armrest: lift a left arm hanging off the side back onto the armrest.
# The start keeps ~34 deg of elbow flexion so it is comfortable for elbow contractures.
# Elbow and wrist both lie in the armrest's height band beside the thigh.
# Upright SMPL frame: +x left, +y up, +z forward.
pose: src/uncertain_feedback/motion_generators/mdm/transfer_seated_pose.pt
seed: 0
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.0025

arm:
  - [-0.116775, -0.001473, -0.433714]
  - [0.731838, -0.532867, -0.880101]
  - [0.014049, -0.351071, 0.296150]

cartesian:
  goals:
    - forearm_box:
        low: [0.16, -0.22, -0.10]
        high: [0.34, -0.08, 0.40]
  threshold: 0.001
