# Visualization-demo scenario: the demo_runner "low2" start arm reaching the
# "across" goal, corrected once by "raise my arm a bit higher" at step 8.
#
# Same body, MPC settings and feedback/uq stack as mpc_demo_low1.yaml; only the
# `arm:`, `cartesian.goals` and `feedback.text_time` differ (both poses/goals are
# verbatim entries from demo_runner_artifacts/trajectory_configs.json).
#
# `llm_cost` is off: this config exists to render the MDM-correction motion
# itself, and the generated-cost layer would reshape the post-correction suffix
# while adding a codex round-trip per correction.
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.01

# demo_runner initial pose "low2"
arm:
  - [-0.07725532398944447, -0.3987584748029073, -0.2849146783698185]
  - [0.37, -0.61, -0.64]
  - [0.011781478320298147, -0.2944062093401433, 0.24834942337626373]

user: unrestricted

feedback:
  max_playback_delta: 0.05
  trajectory_fraction: 1
  frames: 50
  text_time: 8
  uq:
    # Demo-runner clustering defaults (planners/mpc/configs/mdm_llm_transfer.yaml
    # plus config.py's `clusterer` default), so the candidates here are the same
    # ones the web tool would offer.
    diffusion_samples: 500
    n_clusters: 6
    clusterer: agglo_end_pose
    user_cluster: true
    # `scale` is a magnitude knob applied to the chosen mean only, not a
    # clustering setting: the demo runner's 0.5 would draw the picked arm at half
    # the magnitude of the very candidates it is overlaid on.
    scale: 1.0
    # Index, not a prompt-matched pick. The 6 agglo_end_pose candidates for
    # "raise my arm a bit higher" from this start are a magnitude ladder — wrist
    # rise +27.0 / +11.6 / +43.4 / +31.9 / +4.5 / +18.7 cm for clusters 0-5.
    # Cluster 3 (+31.9 cm) is the demo pick: a full, clearly readable lift. On
    # "a bit" alone cluster 1 (+11.6 cm) is the closer literal match, and 4
    # (+4.5 cm) barely moves at all — a run that picks it looks like the
    # correction did nothing.
    auto_cluster: 3

corrections:
  trigger_threshold: 0.02

# demo_runner goal "across"
cartesian:
  goals:
    - [-0.18, 0.12, 0.22]
  threshold: 0.05

preference_learning: false
preference_alpha: 0

simulated_user:
  time_of_day: 9.0

llm_cost:
  enabled: false
  artifact_dir: outputs/low2_across_demo
