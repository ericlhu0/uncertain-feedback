# Planner settings for the procedural-scenario benchmark: mdm_llm_transfer's
# feedback/uq/llm_cost stack at the scenario sampler's pacing (action spread
# 0.0025, 40-step correction window; see informative_scenarios.py). The start
# pose and goal come from each scenario NPZ, so `arm:` and `cartesian.goals`
# are placeholders.
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.0025

feedback:
  max_playback_delta: 0.05
  trajectory_fraction: 1
  frames: 50
  uq:
    diffusion_samples: 500
    n_clusters: 6
    scale: 1.0
    user_cluster: true

corrections:
  trigger_threshold: 0.02

cartesian:
  goals:
    - [0.25, 0.3, 0.18]
  threshold: 0.05

preference_learning: false
preference_alpha: 0

simulated_user:
  time_of_day: 9.0
  nominal_steps: 40

llm_cost:
  enabled: true
  backend: llm
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
  max_turns: 3
  codex_cmd: "codex exec --skip-git-repo-check -s danger-full-access"
