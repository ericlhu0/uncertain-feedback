# Underarm access: elevate the upper arm at least 75 degrees from the side.
# Lateral abduction of at least 45 degrees keeps the elbow away from the torso.
# Seated body (e.g. a shower chair), starting from the pose's lowered, bent left arm.
pose: src/uncertain_feedback/motion_generators/mdm/transfer_seated_pose.pt
seed: 0
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.0025

cartesian:
  goals:
    - features:
        shoulder_elevation: [1.308996939, null]
        shoulder_abduction_adduction: [0.785398163, null]
  threshold: 0.001
