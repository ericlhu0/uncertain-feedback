planner: arm_mpc_cartesian
steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.01
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose_v3.pt"
goal_threshold: 0.15
advance_threshold: 0.15
max_playback_delta: 0.1
trajectory_fraction: 1
mdm_frames: 50

user: stroke_flexor_synergy

corrections:
  trigger_threshold: 0.02

uq:
  diffusion_samples: 500
  n_clusters: 6
  scale: 0.25
  user_cluster: true

cartesian:
  goals:
    - [0.42, 0.48, 0.12]
  threshold: 0.05

transfer:
  goals: []

# In this experiment every cartesian goal is a successive feedback round. These
# goals reuse the base-vs-oracle-screened reachable targets from the transfer
# experiment and span the conditioning feature for each coupled persona.
# All coordinates are spine3-relative. The shared initial pose is demo_pose_v3.pt
# (initial wrist approximately [0.356, -0.091, 0.316] in this frame).
persona_goals:
  stroke_flexor_synergy:
    cartesian:
      - [0.42, 0.48, 0.12]   # lateral raise
      - [0.18, 0.52, 0.14]   # high elevation
      - [0.13, 0.50, 0.28]   # forward elevation
      - [-0.04, 0.48, 0.18]  # across-body elevation
    transfer: []
  cross_body_pain:
    cartesian:
      - [-0.04, 0.45, 0.15]  # shallow cross, high: first boundary observation
      - [-0.12, 0.25, 0.25]  # deeper cross, lower: reveals the coupled slope
      - [0.42, 0.48, 0.12]   # high lateral reach: reject a global elevation cap
    transfer: []
  triceps_long_head_contracture:
    cartesian:
      - [0.25, 0.32, 0.15]   # moderate elevation and elbow bend
      - [-0.05, 0.40, 0.15]  # across-body reach: distinct second observation
      - [0.10, 0.10, 0.25]   # low close reach: elbow flexion should remain allowed
    transfer: []

preference_learning: false
preference_alpha: 0

llm_cost:
  enabled: true
  backend: agent
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
  max_turns: 3
  codex_cmd: "codex exec --skip-git-repo-check -s danger-full-access"  # outer bwrap isolation is applied automatically
