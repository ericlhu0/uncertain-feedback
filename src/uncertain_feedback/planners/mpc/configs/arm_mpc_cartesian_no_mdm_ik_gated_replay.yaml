env: real
env_params:
  robot: kinova_gen3
  robot_max_joint_delta: 0.2
  robot_joint_limit_padding: 0.27
  # Replay of a lab recording instead of the live OptiTrack + Gen3 streams, so
  # this config needs no hardware, no display, and no network. The person in the
  # file does not react to the robot and the arm tracks perfectly — see
  # uncertain_feedback/envs/real_recording.py for what that costs.
  recording: "real_recordings/lab_2026-07-28.npz"
  # Keeps the robot in the loop (an ideal tracker seeded at the recorded joint
  # configuration). Set to null for the mocap-only path, which falls back to the
  # nominal grasp.
  real_mirror_host: "replay"
  # Streaming ids as recorded.
  mocap_rigid_bodies:
    robot_base: 1
    collar: 2
    collar_right: 6
    shoulder: 3
    elbow: 4
    wrist: 5
  mocap_hold_timeout: 0.5
  live_view: false
  preview_plan: false
constraints:
  robot_ik:
    # Gate settings and planner knobs match
    # arm_mpc_cartesian_no_mdm_ik_gated_real.yaml.
    max_residual: 0.001
    grasp_residual_frames: 3
steps: 1000
horizon: 10
n_mpc_samples: 1000
max_angle_delta: 0.01
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose_v3.pt"

arm:
  - [-0.2578684731175734, 0.11215073986226905, -0.44187915175365783]
  - [0.6868865380518193, -0.18, -0.11006289820501858]
  - [0.035651850950680734, -1.23, 0.7515284911778386]

cartesian:
  goals:
    - [0.35, 0.5, 0.18]
  threshold: 0.05
