steps: 300
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.01
feedback:
  max_playback_delta: 0.05
  trajectory_fraction: 1
  frames: 50
  text_time: 10
  uq:
    diffusion_samples: 500
    n_clusters: 3
    auto_cluster: 0
    scale: 1.0

corrections:
  trigger_threshold: 0.02

cartesian:
  goals:
    - [-0.15, 0.05, -0.1]
  threshold: 0.05

preference_learning: false
preference_alpha: 0

llm_cost:
  enabled: true
  model: gpt-5.6-luna
  strict: false
  artifact_dir: llm_cost_artifacts
  use_images: true
  backend: turns
  max_turns: 3
