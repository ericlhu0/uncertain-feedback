planner: arm_mpc_cartesian
motion_generator: kimodo
steps: 350
horizon: 10
n_mpc_samples: 200
max_angle_delta: 0.005
# kimodo start pose is SMPL body_pose (21,3), saved by the asset script.
pose: "src/uncertain_feedback/motion_generators/kimodo/start_pose.npy"
goal_threshold: 0.1
advance_threshold: 0.1
max_playback_delta: 0.1  # max per-joint rotation (rad) per step while following the trajectory
trajectory_fraction: 0.9
text_time: 10

uq:
  diffusion_samples: 500
  n_clusters: 5
  auto_cluster: null

cartesian:
  goals:
    - [-0.15, 0.05, -0.1]
  threshold: 0.05

# Optional:
preference_learning: false
preference_alpha: 0

costs:
  elbow_height:
    min: -0.25
    max: 0.45
    weight: 100.0
    progress_weight: 100.0
