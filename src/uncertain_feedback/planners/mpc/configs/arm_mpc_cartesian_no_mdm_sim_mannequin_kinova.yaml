env: sim_mannequin
env_params:
  # Robot model grasping the mannequin forearm (default: panda).
  robot: kinova_gen3
  # Per-MPC-step cap on each robot joint's travel (rad); lower = smaller,
  # smoother robot motions (and more lag behind the commanded grasp pose).
  robot_max_joint_delta: 0.01
  # Robot base position relative to spine3, pybullet frame (x = person's
  # left, y = behind the person, z = up).
  robot_base_offset: [0.6, -0.35, -0.35]
# Planner knobs match the demo runner's config
# (arm_mpc_cartesian_mdm_llm_transfer.yaml) so trajectories look alike.
# More steps than the kinematic configs: the physical proxy can't realize
# clavicle commands (fixed mannequin shoulder), so convergence is slower.
steps: 1000
horizon: 10
n_mpc_samples: 1000
max_angle_delta: 0.001
# Same body pose the demo runner boots with (its base1/goal library was
# authored against this pose's spine3 frame).
pose: "src/uncertain_feedback/motion_generators/mdm/demo_pose_v3.pt"

# Demo-runner "base1" initial pose ([shoulder, elbow, wrist] axis-angles).
arm:
  - [-0.2578684731175734, 0.11215073986226905, -0.44187915175365783]
  - [0.6868865380518193, -0.18, -0.11006289820501858]
  - [0.035651850950680734, -1.23, 0.7515284911778386]

cartesian:
  # Demo-runner "hits limit 1" goal.
  goals:
    - [0.25, 0.3, 0.18]
  threshold: 0.05
